  apcorr-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]' ruff
      - name: Build and test apcorr metadata fix
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin add-missing-ref-file-metadata
          git checkout -B add-missing-ref-file-metadata origin/add-missing-ref-file-metadata
          python - <<'PY'
          from pathlib import Path
          path = Path('src/stdatamodels/jwst/datamodels/schemas/core.schema.yaml')
          text = path.read_text()
          anchor = '''          bkg:
'''
          entry = '''          apcorr:
            type: object
            properties:
              name:
                title: Aperture correction reference file name
                type: string
                fits_keyword: R_APCORR
                blend_table: True
'''
          if anchor not in text:
              raise SystemExit('Expected bkg reference metadata anchor not found')
          path.write_text(text.replace(anchor, entry + anchor, 1))
          PY
          cat > tests/jwst/datamodels/test_apcorr_reference_metadata.py <<'PY'
from astropy.io import fits

from stdatamodels.jwst.datamodels import ImageModel


def test_apcorr_reference_file_metadata_roundtrip(tmp_path):
    path = tmp_path / "apcorr_metadata.fits"
    reference_name = "jwst_miri_apcorr_0019.fits"

    with ImageModel((2, 2)) as model:
        model.meta.ref_file.apcorr.name = reference_name
        model.save(path)

    with fits.open(path) as hdulist:
        assert hdulist[0].header["R_APCORR"] == reference_name

    with ImageModel(path) as model:
        assert model.meta.ref_file.apcorr.name == reference_name
